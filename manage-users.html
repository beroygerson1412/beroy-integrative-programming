<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Data - NeuroLink AI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="nav-brand gradient-text"
        >NeuroLink AI | Admin</a
      >
      <div class="dashboard-nav">
        <a href="admin.html" class="nav-link">← Back to Dashboard</a>
        <a href="login.html" class="nav-link logout">Logout</a>
      </div>
    </nav>

    <div class="hero-bg">
      <div class="floating-orb orb-2"></div>
    </div>

    <div class="dashboard-container" style="max-width: 1000px; margin: 0 auto">
      <div class="dashboard-content">
        <div class="content-header">
          <h2>Manage System Users</h2>
        </div>

        <div class="admin-panel">
          <h3 style="color: #fff; margin-bottom: 15px">Add New User</h3>
          <form
            id="add-user-form"
            class="auth-form"
            style="
              display: grid;
              grid-template-columns: 1fr 1fr 1fr auto;
              gap: 15px;
              align-items: end;
            "
          >
            <div class="form-group" style="margin: 0">
              <label for="new-name">Name</label>
              <input
                type="text"
                id="new-name"
                class="form-input"
                placeholder="User Name"
              />
            </div>
            <div class="form-group" style="margin: 0">
              <label for="new-email">Email</label>
              <input
                type="email"
                id="new-email"
                class="form-input"
                placeholder="user@email.com"
              />
            </div>
            <div class="form-group" style="margin: 0">
              <label for="new-role">Role</label>
              <select id="new-role" class="form-input" style="cursor: pointer">
                <option value="user">User</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="form-group" style="margin: 0">
              <button
                type="submit"
                class="btn-primary"
                style="padding: 12px 20px"
              >
                Add User
              </button>
            </div>
          </form>
        </div>

        <div class="admin-panel">
          <h3 style="color: #fff; margin-bottom: 15px">User Database</h3>
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="user-table-body">
                <tr>
                  <td>1</td>
                  <td>Ana</td>
                  <td>ana@email.com</td>
                  <td><span class="badge badge-admin">ADMIN</span></td>
                  <td>
                    <button class="btn-small btn-danger btn-delete">
                      Delete
                    </button>
                  </td>
                </tr>
                <tr>
                  <td>2</td>
                  <td>Juan</td>
                  <td>juan@email.com</td>
                  <td><span class="badge badge-user">USER</span></td>
                  <td>
                    <button class="btn-small btn-danger btn-delete">
                      Delete
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
