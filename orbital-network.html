<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbital Network - NeuroLink AI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="nav-brand gradient-text">NeuroLink AI</a>
      <div class="dashboard-nav">
        <a href="profile.html" class="nav-link">← Back to Profile</a>
      </div>
    </nav>

    <div class="hero-bg">
      <div
        class="floating-orb orb-1"
        style="background: rgba(16, 185, 129, 0.2)"
      ></div>
    </div>

    <div class="dashboard-container">
      <div class="dashboard-content" style="max-width: 900px; margin: 0 auto">
        <div
          class="content-header"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <div>
            <h2 style="color: #6ee7b7">Orbital Surveillance Network</h2>
            <p style="color: #9ca3af; margin-top: 10px">
              Live interception of global aerospace and satellite transmissions.
            </p>
          </div>
          <button
            id="refresh-orbit-btn"
            class="btn-primary"
            style="background: linear-gradient(135deg, #059669, #34d399)"
          >
            Sync Transmissions
          </button>
        </div>

        <div
          id="orbit-error"
          class="api-error-box"
          style="
            border-color: #f87171;
            color: #fecaca;
            background: rgba(248, 113, 113, 0.1);
          "
        ></div>

        <div
          id="orbit-loading"
          style="
            text-align: center;
            color: #6ee7b7;
            padding: 40px;
            display: none;
            font-style: italic;
          "
        >
          Establishing connection to orbital satellites...
        </div>

        <div
          id="orbit-results"
          style="
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
          "
        ></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
