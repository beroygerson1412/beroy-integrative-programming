<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cognitive Download - NeuroLink AI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="nav-brand gradient-text">NeuroLink AI</a>
      <div class="dashboard-nav">
        <a href="profile.html" class="nav-link">← Back to Profile</a>
      </div>
    </nav>

    <div class="hero-bg">
      <div class="floating-orb orb-3"></div>
    </div>

    <div class="dashboard-container">
      <div class="dashboard-content" style="max-width: 800px; margin: 0 auto">
        <div class="content-header">
          <h2 style="color: #d8b4fe">Cognitive Download Module</h2>
          <p style="color: #9ca3af; margin-top: 10px">
            Query the global linguistic database to stream knowledge directly to
            your cortex.
          </p>
        </div>

        <div class="api-search-container">
          <input
            type="text"
            id="word-search"
            class="form-input"
            placeholder="Enter a concept or word to download (e.g., Quantum, Inevitable)..."
          />
          <button
            id="word-btn"
            class="btn-primary"
            style="background: linear-gradient(135deg, #9333ea, #c084fc)"
          >
            Download Data
          </button>
        </div>

        <div
          id="word-error"
          class="api-error-box"
          style="
            border-color: #f87171;
            color: #fecaca;
            background: rgba(248, 113, 113, 0.1);
          "
        ></div>

        <div id="word-results"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
